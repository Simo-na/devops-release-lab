
name: CI - Validate PHP and Build Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate PHP syntax
        run: php -l index.php

      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker build --tag "devops-release-lab:$IMAGE_TAG" .

